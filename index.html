<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Pagamento Pix — Digital Consórcio</title>
<meta name="robots" content="noindex,nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0B1220;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;font-family:'Inter',system-ui,sans-serif;}
.card{width:100%;max-width:400px;background:#111E32;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.header{background:linear-gradient(135deg,#0D1524,#111E32);padding:24px;border-bottom:1px solid #1E2D4A;text-align:center;}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#5DCAA5;margin-bottom:8px;}
.title{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;}
.adm{font-size:12px;color:#5DCAA5;}
.valor{font-size:32px;font-weight:900;color:#1D9E75;margin:12px 0 4px;}
.para{font-size:11px;color:#8899AA;}
.body{padding:24px;}
.qr-wrap{display:inline-block;background:#fff;padding:14px;border-radius:14px;margin-bottom:14px;}
canvas{display:block;}
.instrucao{font-size:12px;color:#5DCAA5;margin-bottom:20px;}
.codigo-box{background:#0D1524;border:1px solid #1E2D4A;border-radius:8px;padding:10px 14px;font-family:monospace;font-size:10px;color:#8899AA;word-break:break-all;margin-bottom:16px;max-height:64px;overflow:hidden;}
.btn-copiar{width:100%;padding:16px;background:#1D9E75;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.2s;}
.btn-copiar:active{background:#0F7A5A;}
.copiado{display:none;margin-top:12px;font-size:13px;color:#5DCAA5;font-weight:600;}
.footer{background:#070D19;padding:14px 24px;text-align:center;border-top:1px solid #1E2D4A;}
.footer-txt{font-size:10px;color:#3A4A5A;}
.erro{padding:40px;text-align:center;color:#dc2626;font-size:14px;}
</style>
</head>

// ===== MAIN =====
var pixCode='';
function init(){
  var hash=location.hash;
  if(!hash.startsWith('#pix=')){showErro();return;}
  try{
    var p=JSON.parse(decodeURIComponent(escape(atob(hash.slice(5)))));
    pixCode=p.c||'';
    render(p);
  }catch(e){showErro();}
}
function showErro(){
  document.getElementById('card').innerHTML='<div class="erro">Link inválido ou expirado.</div>';
}

  var card=document.getElementById('card');

    '<div class="header">'+
      '<div class="badge">Pagamento Seguro</div>'+
      '<div class="title">'+(p.l||'Pagamento Pix')+'</div>'+
      '<div class="adm">'+admCurta+'</div>'+
      (p.v?'<div class="valor">'+p.v+'</div>':'')+
      (p.n?'<div class="para">Para: '+p.n+'</div>':'')+
    '</div>'+
    '<div class="body" style="text-align:center;">'+
      '<div class="qr-wrap"><canvas id="qr" width="200" height="200"></canvas></div>'+
      '<div class="instrucao">Escaneie com o app do seu banco</div>'+
      '<div class="codigo-box">'+p.c.substring(0,100)+'…</div>'+
      '<button class="btn-copiar" id="btn" onclick="copiar()">📋 Copiar código Pix</button>'+
      '<div class="copiado" id="msg">✅ Código copiado! Cole no seu banco.</div>'+
    '</div>'+
    '<div class="footer"><div class="footer-txt">🔒 '+adm+' — Pagamento Pix</div></div>';
  setTimeout(function(){drawQR(document.getElementById('qr'),p.c);},80);
}
function copiar(){
  if(!pixCode)return;
  navigator.clipboard.writeText(pixCode).then(function(){ok();}).catch(function(){
    var el=document.createElement('textarea');el.value=pixCode;
    document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);ok();
  });
}
function ok(){
  document.getElementById('msg').style.display='block';
  var b=document.getElementById('btn');if(b){b.textContent='✅ Copiado!';b.style.background='#0F7A5A';}
}
init();
</script>
</body>
</html>
