<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pagamento — Digital Consórcio</title>
<meta name="robots" content="noindex,nofollow"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0B1220;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;font-family:'Inter',system-ui,sans-serif;}
.card{width:100%;max-width:400px;background:#111E32;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.header{background:linear-gradient(135deg,#0D1524,#111E32);padding:22px 24px;border-bottom:1px solid #1E2D4A;text-align:center;}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#5DCAA5;margin-bottom:8px;}
.title{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;}
.adm{font-size:12px;color:#5DCAA5;}
.valor{font-size:32px;font-weight:900;color:#1D9E75;margin:12px 0 4px;}
.para{font-size:11px;color:#8899AA;}
.body{padding:24px;text-align:center;}
#qrcode{display:inline-block;background:#fff;padding:14px;border-radius:14px;margin-bottom:14px;}
#qrcode canvas,#qrcode img{display:block;}
.instrucao{font-size:12px;color:#5DCAA5;margin-bottom:20px;}
.btn-copiar{width:100%;padding:16px;background:#1D9E75;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.2s;}
.btn-copiar:active{background:#0F7A5A;}
.copiado{display:none;margin-top:12px;font-size:13px;color:#5DCAA5;font-weight:600;}
.footer{background:#070D19;padding:14px 24px;text-align:center;border-top:1px solid #1E2D4A;}
.footer-txt{font-size:10px;color:#3A4A5A;}
.erro{padding:40px;text-align:center;color:#dc2626;font-size:14px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div style="padding:40px;text-align:center;color:#5DCAA5;">Carregando...</div>
</div>
<script>
var pixCode='';

function showErro(msg){
  document.getElementById('card').innerHTML='<div class="erro">'+(msg||'Link inválido ou expirado.')+'</div>';
}

function init(){
  try{
    var hash=window.location.hash;
    if(!hash||hash.indexOf('pix=')<0){showErro('Link inválido.');return;}
    var b64=hash.substring(hash.indexOf('pix=')+4);
    if(!b64){showErro('Dados ausentes.');return;}
    var json;
    try{
      json=decodeURIComponent(escape(atob(b64)));
    }catch(e){
      try{json=atob(b64);}
      catch(e2){showErro('Erro ao decodificar link.');return;}
    }
    var p=JSON.parse(json);
    if(!p||!p.c){showErro('Código Pix não encontrado.');return;}
    pixCode=p.c;
    render(p);
  }catch(e){
    showErro('Erro: '+e.message);
  }
}

function render(p){
  var adm=p.a==='recon'?'Digital Consórcio (Recon - BMW)':'Digital Consórcio (Âncora - Kawasaki)';
  var admCurta=p.a==='recon'?'Consórcio Nacional Recon':'Âncora Administradora';
  var card=document.getElementById('card');
  card.innerHTML=
    '<div class="header">'+
      '<div class="badge">Pagamento Seguro</div>'+
      '<div class="title">'+(p.l||'Pagamento Pix')+'</div>'+
      '<div class="adm">'+admCurta+'</div>'+
      (p.v?'<div class="valor">'+p.v+'</div>':'')+
      (p.n?'<div class="para">Para: '+p.n+'</div>':'')+
    '</div>'+
    '<div class="body">'+
      '<div id="qrcode"></div>'+
      '<div class="instrucao">Escaneie com o app do seu banco</div>'+
      '<button class="btn-copiar" id="btn-copiar" onclick="copiar()">📋 Copiar código Pix</button>'+
      '<div class="copiado" id="msg-copiado">✅ Copiado! Cole no seu banco.</div>'+
    '</div>'+
    '<div class="footer"><div class="footer-txt">🔒 '+adm+'</div></div>';

  // Gera QR code
  try{
    new QRCode(document.getElementById('qrcode'),{
      text:p.c,
      width:180,
      height:180,
      colorDark:'#000',
      colorLight:'#fff',
      correctLevel:QRCode.CorrectLevel.M
    });
  }catch(e){
    document.getElementById('qrcode').innerHTML='<div style="color:#8899AA;font-size:11px;padding:10px;">QR code indisponível</div>';
  }
}

function copiar(){
  if(!pixCode)return;
  try{
    navigator.clipboard.writeText(pixCode).then(function(){ok();}).catch(function(){fallback();});
  }catch(e){fallback();}
}

function fallback(){
  var el=document.createElement('textarea');
  el.value=pixCode;
  el.style.position='fixed';
  el.style.opacity='0';
  document.body.appendChild(el);
  el.focus();el.select();
  try{document.execCommand('copy');ok();}catch(e){}
  document.body.removeChild(el);
}

function ok(){
  var m=document.getElementById('msg-copiado');
  var b=document.getElementById('btn-copiar');
  if(m)m.style.display='block';
  if(b){b.textContent='✅ Copiado!';b.style.background='#0F7A5A';}
}

window.addEventListener('load',init);
</script>
</body>
</html>
